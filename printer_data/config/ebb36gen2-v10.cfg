## ebb36gen2
[mcu ebb36gen2]
# run the following command to locate the uuid >   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_uuid: 5168720473417293 

## ebb36
[temperature_sensor ebb36gen2]
sensor_type: temperature_mcu
sensor_mcu: ebb36gen2

## HOT END FAN
[heater_fan hotend_fan]
pin: ebb36gen2:PD2  # FAN2
tachometer_pin: ebb36gen2:PA4  # FAN2_DET

## PART COOLING
[fan]
pin: ebb36gen2:PA5  # FAN1

## EXTRUDER 
[extruder]
step_pin: ebb36gen2:PB14
dir_pin: ebb36gen2:PA8
enable_pin: !ebb36gen2:PB6
heater_pin: ebb36gen2:PB4
pullup_resistor: 2200
sensor_pin: ebb36gen2:PA3

## EXTRUDER MOTOR
[tmc2209 extruder]
uart_pin: ebb36gen2:PA15

## RESONANCES
[lis2dw ebb36gen2]
cs_pin: ebb36gen2:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw ebb36gen2

## RGB
[neopixel tool0_leds]
pin: ebb36gen2:PC7

## PROBE
[probe]
pin: ebb36gen2:PB8
